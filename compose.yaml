services:
  db:
    platform: linux/amd64
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    environment:
      POSTGRES_USER: georeference_test
      POSTGRES_DB: places_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a local database password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database:/workspace/database:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "georeference_test", "-d", "places_dev"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
